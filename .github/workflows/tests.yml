name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: lint + build + unit/integration
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install data processing system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Prepare database
        run: npm run data:prepare

      - name: Lint monorepo
        run: npm run lint

      - name: Build monorepo
        run: npm run build

      - name: Run unit and integration tests
        run: npm run test

  e2e-mobile:
    name: e2e mobile (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: verify

    env:
      CI: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: android
            browser: chromium
          - project: ios
            browser: webkit
          - project: android-tablet
            browser: chromium
          - project: ipad
            browser: webkit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install data processing system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Prepare database
        run: npm run data:prepare

      - name: Install Playwright browser and dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run mobile E2E tests for ${{ matrix.project }}
        run: npm run test:e2e:mobile -- --project=${{ matrix.project }}

  e2e-admin:
    name: e2e admin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser and dependencies
        run: npx playwright install --with-deps chromium

      - name: Run admin E2E tests
        run: npm run test:e2e:admin -- --project=admin-desktop
